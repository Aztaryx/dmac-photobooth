<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/global.css" />
    <title>DigiClick: Auditor</title>
  </head>
  <body>
    <main>
      <div class="tabs" id="tabs"></div>
      <div id="v"></div>
      <dialog id="dlg">
        <div id="dc"></div>
        <form method="dialog">
          <button>Close</button>
        </form>
      </dialog>
    </main>
    <script src="js/vendor/supabase.js"></script>
    <script type="module">
      import { boot, ask, esc } from "./js/auth.js";
      import { sb } from "./js/supabase.js";

      const op = await boot("auditor", "Auditor");
      const v = document.getElementById("v");
      const $ = (id) => document.getElementById(id);
      const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
      const gen = () => {
        let o = "";
        while (o.length < 6) {
          for (const x of crypto.getRandomValues(new Uint8Array(12))) {
            if (x < 248 && o.length < 6) o += A[x % 31];
          }
        }
        return o;
      };
      const dash = (p) => p.slice(0, 3) + "-" + p.slice(3);
      const table = (rows, act) =>
        rows.length
          ? `<div style="overflow-x:auto"><table><tr>${Object.keys(rows[0])
              .map((k) => "<th>" + esc(k) + "</th>")
              .join("")}${act ? "<th></th>" : ""}</tr>${rows
              .map(
                (r, i) =>
                  "<tr>" +
                  Object.values(r)
                    .map((c) => {
                      const value =
                        c !== null && typeof c === "object"
                          ? JSON.stringify(c)
                          : c;
                      return "<td>" + esc(value) + "</td>";
                    })
                    .join("") +
                  (act
                    ? `<td><button data-h="${i}">History</button> <button data-e="${i}">Edit</button></td>`
                    : "") +
                  "</tr>",
              )
              .join("")}</table></div>`
          : "<p class=empty>Nothing here.</p>";

      const view = {
        async dash() {
          const [t, p] = await Promise.all([
            sb.from("tickets").select("status,package"),
            sb.from("payments").select("kind,amount_php"),
          ]);
          if (t.error || p.error)
            return (v.textContent = (t.error || p.error).message);

          const n = {};
          t.data.forEach((x) => (n[x.status] = (n[x.status] || 0) + 1));
          const pay = p.data
            .filter((x) => x.kind === "payment")
            .reduce((s, x) => s + x.amount_php, 0);
          const ref = p.data
            .filter((x) => x.kind === "refund")
            .reduce((s, x) => s - x.amount_php, 0);
          const S = (l, x) =>
            `<div class="card"><div class="stat">${x}</div>${l}</div>`;

          v.innerHTML = `<div class="stats">${S("Cash collected (Php)", pay - ref)}${S("Refunds (Php)", ref)}${S("Voided tickets", n.void || 0)}${S("All tickets", t.data.length)}</div><h2>Tickets by status</h2><div class="stats">${[
            "awaiting_payment",
            "paid",
            "editing",
            "ready",
            "delivered",
          ]
            .map((s) => S(s.replace("_", " "), n[s] || 0))
            .join("")}</div>`;
        },

        async raw() {
          v.innerHTML = `<select id="tb" style="max-width:260px">${[
            "tickets",
            "payments",
            "deliveries",
            "audit_log",
            "price_list",
            "role_pins",
          ]
            .filter((x) => x !== "role_pins")
            .map((x) => "<option>" + x + "</option>")
            .join("")}</select><div id="tt"></div>`;
          const ord = {
            tickets: "created_at",
            payments: "created_at",
            deliveries: "sent_at",
            audit_log: "at",
          };
          const go = async () => {
            const t = $("tb").value;
            let r = await sb
              .from(t)
              .select("*")
              .order(ord[t] || "package", { ascending: false })
              .limit(300);
            if (r.error) r = await sb.from(t).select("*").limit(300);
            if (r.error) return ($("tt").textContent = r.error.message);
            rows = r.data;
            $("tt").innerHTML = table(rows, t !== "audit_log");
          };
          let rows = [];
          $("tb").onchange = go;
          go();
          $("tt").onclick = async (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            const t = $("tb").value;

            if (b.dataset.h !== undefined) {
              const r = rows[b.dataset.h];
              const h = await sb
                .from("audit_log")
                .select("*")
                .eq("row_id", String(r.id ?? r.package))
                .order("at", { ascending: false });
              $("dc").innerHTML =
                "<h3>History</h3>" +
                (h.error ? esc(h.error.message) : table(h.data));
              $("dlg").showModal();
            }

            if (b.dataset.e !== undefined) {
              const r = rows[b.dataset.e];
              const f = await ask("Which field to change?", {
                label: "Field name",
              });
              if (!f) return;
              const nv = await ask("New value for " + f, {
                label: "Value",
                value: r[f.trim()] ?? "",
              });
              if (nv === null) return;
              const why = await ask("Why are you changing it?", {
                label: "Reason (required)",
              });
              if (!why?.trim()) return;
              let val = nv;
              try {
                val = JSON.parse(nv);
              } catch {}
              const { error } = await sb.rpc("auditor_edit", {
                p_table: t,
                p_row_id: String(r.id ?? r.package),
                p_changes: { [f.trim()]: val },
                p_reason: why.trim(),
                p_operator: op,
              });
              error ? alert(error.message) : go();
            }
          };
        },

        async exc() {
          const r = await sb.from("v_exceptions").select("*");
          v.innerHTML = r.error ? esc(r.error.message) : table(r.data);
        },

        async acc() {
          const r = await sb.from("role_pins").select("*");
          if (r.error) return (v.textContent = r.error.message);
          const m = Object.fromEntries(r.data.map((x) => [x.role, x]));
          v.innerHTML = ["kiosk", "cashier", "camera", "editor", "auditor"]
            .map(
              (k) =>
                `<div class="card"><div class="c">${k}</div><span class="pin" data-r="${k}">••• •••</span><br><small>${m[k] ? "Regenerated " + new Date(m[k].regenerated_at).toLocaleString() + " by " + esc(m[k].regenerated_by) : "No PIN stored yet. Press Regenerate."}</small><div class="row"><button data-s="${k}" data-p="${m[k]?.pin || ""}">Reveal</button><button data-c="${k}" data-p="${m[k]?.pin || ""}">Copy</button><button class="warn" data-g="${k}">Regenerate</button></div></div>`,
            )
            .join("");
          v.onclick = async (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            if (b.dataset.s && b.dataset.p) {
              const s = v.querySelector(`[data-r=${b.dataset.s}]`);
              s.textContent = s.textContent.includes("•")
                ? dash(b.dataset.p)
                : "••• •••";
              b.textContent = s.textContent.includes("•") ? "Reveal" : "Hide";
            }
            if (b.dataset.c && b.dataset.p) {
              await navigator.clipboard.writeText(dash(b.dataset.p));
              b.textContent = "Copied";
            }
            if (b.dataset.g) {
              const k = b.dataset.g;
              if (
                !(
                  await ask(
                    "Regenerate the " +
                      k +
                      " PIN? Everyone signed in as " +
                      k +
                      " is signed out.",
                  )
                )
              )
                return;
              const { error } = await sb.rpc("regenerate_pin", {
                p_role: k,
                p_pin: gen(),
                p_operator: op,
              });
              error ? alert(error.message) : view.acc();
            }
          };
        },
      };
      const names = {
        dash: "Dashboard",
        raw: "Raw tables",
        exc: "Exceptions",
        acc: "Access",
      };
      $("tabs").innerHTML = Object.entries(names)
        .map(([k, l]) => `<button data-t="${k}">${l}</button>`)
        .join("");
      const show = (k) => {
        v.onclick = null;
        v.innerHTML = "";
        $("tabs")
          .querySelectorAll("button")
          .forEach((b) =>
            b.setAttribute("aria-selected", b.dataset.t === k),
          );
        view[k]();
      };
      $("tabs").onclick = (e) =>
        e.target.dataset.t && show(e.target.dataset.t);
      show("dash");
    </script>
  </body>
</html>
