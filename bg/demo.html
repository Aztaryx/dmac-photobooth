<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bgstack background demo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#background{position:fixed;inset:0;z-index:0}#background canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.content{position:relative;z-index:1;color:white;padding:2rem;font:16px system-ui}</style></head><body><div id="background"><canvas id="bg"></canvas><canvas id="overlay"></canvas></div><main class="content"><!-- Put your website content here. --></main><script src="./bgstack-runtime.js"></script><script>const bg=BgStack.create(document.querySelector('#bg'),{overlay:document.querySelector('#overlay'),scale:3,smooth:true,keys:false});bg.loadPackage('./bgstack.json').then(()=>bg.start()).catch(e=>console.error(e));</script></body></html>
