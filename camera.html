<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <title>DigiClick: Camera</title>
  </head>
  <body>
    <main>
      <p class="empty">
        Photos stay on this device. The check marks below are saved on this device only.
      </p>
      <div id="q"></div>
    </main>
    <script src="js/vendor/supabase.js"></script>
    <script type="module">
      import { boot, esc } from "./js/auth.js";
      import { reconcile } from "./js/ui.js";
      import { sb } from "./js/supabase.js";
      await boot("camera", "Camera");
      const L = {
        digital: "Digital",
        physical_week: "Physical, next week",
        physical_day: "Physical, same day",
      };
      const shot = new Set(JSON.parse(localStorage.dc_shot || "[]"));
      async function load() {
        const { data, error } = await sb
          .from("tickets")
          .select("id,ticket_code,name,package,status")
          .eq("status", "paid")
          .order("created_at");
        if (error) return;
        const all = [...data].sort((a, b) => shot.has(a.id) - shot.has(b.id));
        reconcile(q, all, {
          key: (x) => x.id,
          cls: (x) => (shot.has(x.id) ? "done" : ""),
          empty: "No paid tickets waiting.",
          html: (x) =>
            `<h3 class="name">${esc(x.name)}</h3><p class="meta">${esc(x.ticket_code)}</p><p class="line">${L[x.package]}, 3 photos</p><div class="row"><button class="${shot.has(x.id) ? "ghost" : "pri"}" data-id="${x.id}">${shot.has(x.id) ? "Undo photographed" : "Photographed"}</button></div>`,
        });
      }
      const q = document.getElementById("q");
      q.onclick = (e) => {
        const id = e.target.closest("button")?.dataset.id;
        if (!id) return;
        shot.has(id) ? shot.delete(id) : shot.add(id);
        localStorage.dc_shot = JSON.stringify([...shot]);
        load();
      };
      load();
      setInterval(load, 10000);
    </script>
  </body>
</html>
